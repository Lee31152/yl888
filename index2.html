<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黄麟 | 视觉设计师 · AI设计师 · 品牌设计师</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          maxWidth: {
            'site': '1700px',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            dark: {
              950: '#070709',
              900: '#0c0d12',
              800: '#141620',
              700: '#1f2232',
            },
            accent: {
              cyan: '#00F0FF',
              purple: '#7000FF',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN (国内可访问镜像) -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #070709;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .bg-grid-pattern {
      background-size: 48px 48px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    /* 平滑滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #070709;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2232;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00F0FF;
    }
  </style>
</head>
<body class="selection:bg-cyan-400 selection:text-black antialiased overflow-x-hidden">
  <div id="root"></div>

  <!-- React 代码入口 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 内联 SVG 图标组件（避免 CDN 加载外部图标库失败）
    const IconSparkles = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>;
    const IconArrowUpRight = ({ size = 20 }) => <svg width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 17L17 7M17 7H7M17 7V17"/></svg>;
    const IconMenu = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/></svg>;
    const IconClose = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>;
    const IconChevronDown = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>;
    const IconCpu = () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M3 9h2m-2 6h2m14-6h2m-2 6h2M7 7h10a2 2 0 012 2v10a2 2 0 01-2 2H7a2 2 0 01-2-2V9a2 2 0 012-2z"/></svg>;
    const IconPalette = () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21a4 4 0 01-4-4 7 7 0 0114 0 4 4 0 01-4 4 4 4 0 01-4-4 2 2 0 00-2-2 2 2 0 00-2 2 4 4 0 01-4 4z"/></svg>;
    const IconTerminal = () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>;
    const IconLayers = () => <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>;
    const IconAward = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const IconPhone = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>;
    const IconMail = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>;
    const IconMessage = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>;

    function App() {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [activeSection, setActiveSection] = useState('home');
      const [navScrolled, setNavScrolled] = useState(false);
      const [certModalOpen, setCertModalOpen] = useState(false);

      const certificates = [
        'AI1.jpg', 'work1 .png', 'work3.png', 'work4.png',
        'work5.png', 'work6.png', 'work7.png', 'work8.png'
      ];

      useEffect(() => {
        const handleScroll = () => {
          const heroEl = document.getElementById('home');
          if (heroEl) {
            setNavScrolled(window.scrollY > heroEl.offsetHeight - 80);
          }

          const sections = ['home', 'about', 'projects', 'capabilities', 'contact', 'thanks'];
          const scrollPosition = window.scrollY + 200;

          for (const section of sections) {
            const el = document.getElementById(section);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPosition >= top && scrollPosition < top + height) {
                setActiveSection(section);
                break;
              }
            }
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollTo = (id) => {
        setMobileMenuOpen(false);
        const element = document.getElementById(id);
        if (element) {
          element.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <div className="min-h-screen bg-[#070709] text-slate-100 relative">
          
          {/* 背景环境光晕 */}
          <div className="fixed top-0 left-1/4 w-[600px] h-[600px] bg-purple-600/10 rounded-full blur-[140px] pointer-events-none -z-10" />
          <div className="fixed bottom-10 right-1/4 w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-[140px] pointer-events-none -z-10" />

          {/* 顶部导航栏 */}
          <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${
            navScrolled 
              ? 'backdrop-blur-xl bg-[#070709]/80 border-b border-white/[0.06]' 
              : 'bg-transparent border-b border-transparent'
          }`}>
            <div className="max-w-[1700px] mx-auto px-6 lg:px-12 h-20 flex items-center justify-between">
              
              <a href="#home" className="flex items-center gap-3 group">
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 group-hover:shadow-[0_0_12px_#00F0FF] transition-all duration-300"></span>
                <span className="font-mono text-lg font-bold tracking-wider text-white">HUANG LIN.</span>
                <span className="hidden sm:inline-block text-xs uppercase tracking-widest text-slate-400 border-l border-white/10 pl-3 font-mono">
                  DESIGN & AI WORKFLOW
                </span>
              </a>

              {/* PC 端导航 */}
              <nav className="hidden md:flex items-center gap-8 text-xs font-mono tracking-wider text-slate-400">
                {[
                  ['01 // 首页', 'home'],
                  ['02 // 履历与数据', 'about'],
                  ['03 // 精选项目', 'projects'],
                  ['04 // 核心优势', 'capabilities'],
                  ['05 // 联络合作', 'contact'],
                  ['06 // 特别鸣谢', 'thanks'],
                ].map(([label, id]) => (
                  <button
                    key={id}
                    onClick={() => scrollTo(id)}
                    className={`relative transition-all duration-300 hover:text-cyan-400 after:absolute after:bottom-0 after:left-0 after:h-[1px] after:bg-cyan-400 after:transition-all after:duration-300 ${
                      activeSection === id ? 'text-cyan-400 font-semibold after:w-full' : 'after:w-0 hover:after:w-full'
                    }`}
                  >
                    {label}
                  </button>
                ))}
              </nav>

              {/* 动作按钮与汉堡菜单 */}
              <div className="flex items-center gap-4">
                <button
                  onClick={() => scrollTo('contact')}
                  className="hidden sm:inline-flex items-center justify-center px-5 py-2.5 rounded-full border border-white/20 text-xs font-mono tracking-wider text-slate-300 hover:text-cyan-400 hover:border-cyan-400 hover:bg-cyan-400/10 hover:shadow-[0_0_20px_rgba(0,240,255,0.15)] transition-all duration-300 backdrop-blur-md"
                >
                  LET'S TALK
                </button>
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="md:hidden p-2 text-slate-300 hover:text-cyan-400 transition-all duration-300"
                  aria-label="Toggle Menu"
                >
                  {mobileMenuOpen ? <IconClose /> : <IconMenu />}
                </button>
              </div>
            </div>

            {/* 移动端抽屉菜单 */}
            {mobileMenuOpen && (
              <div className="md:hidden border-b border-white/10 bg-[#0c0d12]/95 backdrop-blur-2xl px-6 py-8 flex flex-col gap-6">
                {[
                  ['01. 首页 // HOME', 'home'],
                  ['02. 履历与数据 // ABOUT & STATS', 'about'],
                  ['03. 精选项目 // FEATURED WORKS', 'projects'],
                  ['04. 核心优势 // CAPABILITIES', 'capabilities'],
                  ['05. 联络合作 // CONTACT', 'contact'],
                  ['06. 特别鸣谢 // THANKS', 'thanks'],
                ].map(([label, id]) => (
                  <button
                    key={id}
                    onClick={() => scrollTo(id)}
                    className="text-left text-base font-mono tracking-wide text-slate-300 hover:text-cyan-400 hover:bg-cyan-400/5 hover:pl-2 transition-all duration-300 py-2 border-b border-white/5"
                  >
                    {label}
                  </button>
                ))}
              </div>
            )}
          </header>

          <main className="w-full">
            
            {/* ========================================================================= */}
            {/* 1. HERO 模块 (全屏视频/网格背景) */}
            {/* ========================================================================= */}
            <section id="home" className="relative min-h-screen flex items-center justify-center pt-20 overflow-hidden bg-grid-pattern">
              {/* 背景视频 */}
              <div className="absolute inset-0 z-0 pointer-events-none overflow-hidden">
                <video
                  autoPlay
                  loop
                  muted
                  playsInline
                  className="absolute inset-0 w-full h-full object-cover"
                >
                  <source src="photo.mp4" type="video/mp4" />
                </video>
                <div className="absolute inset-0 bg-gradient-to-b from-[#0a141c]/30 via-[#0a141c]/65 to-[#070709]/95" />
              </div>

              <div className="relative z-10 max-w-[1700px] w-full mx-auto px-6 lg:px-12 py-16 flex flex-col justify-between min-h-[calc(100vh-5rem)]">
                <div className="flex-1 flex flex-col justify-center max-w-5xl">
                  
                  {/* Badge 状态 */}
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-cyan-400/30 bg-cyan-400/10 text-cyan-400 text-xs font-mono tracking-wider w-fit mb-8 backdrop-blur-sm">
                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_#00F0FF]"></span>
                    AVAILABLE FOR FREELANCE & PRODUCT DESIGN
                  </div>

                  {/* 大标题 */}
                  <h1 className="text-4xl sm:text-6xl lg:text-7xl xl:text-8xl font-black tracking-tight leading-[1.08] text-white">
                    BRIDGING <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-indigo-400">AI AGILITY</span> &amp; <br />
                    HIGH-END VISUALS.
                  </h1>

                  <p className="mt-8 text-base sm:text-xl lg:text-2xl text-slate-300 font-light max-w-3xl leading-relaxed">
                    我是 <strong className="text-white font-semibold">黄麟</strong>，融合 AI 大模型工程化思维与高质感视觉传达的 
                    <span className="text-cyan-400 font-medium"> 视觉设计师 / AI设计师 / 品牌设计师</span>。专注于打造人机协同的新一代数字体验与品牌叙事。
                  </p>

                  {/* 核心行动按钮 */}
                  <div className="mt-10 flex flex-wrap items-center gap-4">
                    <button 
                      onClick={() => scrollTo('projects')}
                      className="px-8 py-4 rounded-full bg-white text-black font-semibold text-sm tracking-wide hover:bg-cyan-400 hover:shadow-[0_0_30px_rgba(0,240,255,0.4)] transition-all duration-300 flex items-center gap-2"
                    >
                      探索精选项目
                      <IconArrowUpRight size={18} />
                    </button>
                    <button 
                      onClick={() => scrollTo('contact')}
                      className="px-8 py-4 rounded-full border border-white/20 bg-white/5 text-slate-300 hover:text-cyan-400 hover:border-cyan-400/50 hover:bg-cyan-400/10 hover:shadow-[0_0_25px_rgba(0,240,255,0.15)] font-mono text-xs tracking-wider transition-all duration-300 backdrop-blur-md"
                    >
                      快速联络我
                    </button>
                  </div>
                </div>

                {/* Hero 底部元数据 */}
                <div className="pt-12 border-t border-white/[0.08] grid grid-cols-2 md:grid-cols-4 gap-6 text-slate-400 text-xs font-mono backdrop-blur-sm">
                  <div>
                    <p className="text-slate-500 uppercase tracking-wider mb-1">LOCATION</p>
                    <p className="text-slate-300 font-medium">GUANGZHOU / SHANTOU, CN</p>
                  </div>
                  <div>
                    <p className="text-slate-500 uppercase tracking-wider mb-1">EDUCATION</p>
                    <p className="text-slate-300 font-medium">华南师范大学 本科在读</p>
                  </div>
                  <div>
                    <p className="text-slate-500 uppercase tracking-wider mb-1">CORE FOCUS</p>
                    <p className="text-slate-300 font-medium">Prompt Engineering & Visuals</p>
                  </div>
                  <div className="flex items-center md:justify-end gap-2 text-cyan-400">
                    <span className="animate-pulse">SCROLL DOWN</span>
                    <IconChevronDown />
                  </div>
                </div>
              </div>
            </section>

            {/* ========================================================================= */}
            {/* 2. 个人经历与核心数据模块 */}
            {/* ========================================================================= */}
            <section id="about" className="py-24 sm:py-32 border-t border-white/10 bg-[#0a0a0e] relative">
              <div className="max-w-[1700px] mx-auto px-6 lg:px-12">
                
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-16 items-start">
                  
                  {/* 左侧人物主图 */}
                  <div className="lg:col-span-5 relative group">
                    <div className="relative aspect-[4/5] rounded-3xl overflow-hidden bg-white/5 border border-white/10 shadow-2xl">
                      <img 
                        loading="lazy"
                        src="https://images.unsplash.com/photo-1684369176170-463e84248b70?auto=format&fit=crop&w=1000&q=80" 
                        alt="AI 机器人" 
                        className="w-full h-full object-cover grayscale contrast-125 group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700 ease-out"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-[#070709] via-transparent to-transparent opacity-80" />
                      
                      <div className="absolute bottom-6 left-6 right-6 p-6 rounded-2xl bg-[#0c0d12]/80 backdrop-blur-xl border border-white/10">
                        <p className="text-xs font-mono text-cyan-400 uppercase tracking-wider">Visual & AI Designer</p>
                        <h3 className="text-xl font-bold text-white mt-1">黄麟 / Huang Lin</h3>
                        <p className="text-xs text-slate-400 mt-2 font-mono">潮阳实验学校优秀校友 · 4项国家/行业级AI认证</p>
                      </div>
                    </div>
                  </div>

                  {/* 右侧履历与深度阐述 */}
                  <div className="lg:col-span-7 flex flex-col justify-between h-full">
                    <div>
                      <div className="flex items-center gap-3 text-cyan-400 font-mono text-xs tracking-widest uppercase mb-4">
                        <span className="w-8 h-[1px] bg-cyan-400"></span>
                        ABOUT & BACKGROUND
                      </div>
                      <h2 className="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight">
                        将严谨数理逻辑，<br />
                        注入先锋的数字视觉传达。
                      </h2>

                      <div className="mt-8 space-y-6 text-slate-300 text-sm sm:text-base lg:text-lg leading-relaxed font-light">
                        <p>
                          就读于 <span className="text-white font-medium">华南师范大学</span>，高中毕业于知名重点中学（潮阳实验学校），具备扎实的数理逻辑与结构化思维。在大一期间便主动自学并通过了包括<strong>阿里云高级人工智能训练师</strong>、<strong>科大讯飞提示词工程师</strong>在内的 4 项专业 AI 认证。
                        </p>
                        <p>
                          我致力于探索 <span className="text-cyan-400 font-medium">生成式 AI 工作流（Midjourney / SD / LLM）</span> 与现代前端工程的结合点。无论是商业级 PPT 视觉体系重构，还是全流程人机协同的数字产品开发，我都能以敏捷、精准的执行力实现降本增效与高品质交付。
                        </p>
                      </div>
                    </div>

                    {/* 量化数据看板 */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6 mt-12 pt-10 border-t border-white/10">
                      <div className="bg-white/[0.02] p-5 rounded-2xl border border-white/5">
                        <div className="text-3xl sm:text-4xl font-black text-cyan-400 font-mono">60%<span className="text-white text-lg">↓</span></div>
                        <p className="text-xs text-slate-400 mt-2">开发与迭代周期缩短</p>
                      </div>
                      <div className="bg-white/[0.02] p-5 rounded-2xl border border-white/5">
                        <div className="text-3xl sm:text-4xl font-black text-purple-400 font-mono">3x<span className="text-white text-lg">↑</span></div>
                        <p className="text-xs text-slate-400 mt-2">AIGC视觉素材产出效率</p>
                      </div>
                      <div className="bg-white/[0.02] p-5 rounded-2xl border border-white/5">
                        <div className="text-3xl sm:text-4xl font-black text-white font-mono">200+</div>
                        <p className="text-xs text-slate-400 mt-2">沉淀高精度Prompt工程模板</p>
                      </div>
                      <div className="bg-white/[0.02] p-5 rounded-2xl border border-white/5">
                        <div className="text-3xl sm:text-4xl font-black text-emerald-400 font-mono">&lt;1.2s</div>
                        <p className="text-xs text-slate-400 mt-2">前端全响应式极速首屏</p>
                      </div>
                    </div>

                    {/* 认证与荣誉徽章 */}
                    <div className="mt-8 flex flex-wrap gap-2.5">
                      {[
                        "阿里云 · 高级人工智能训练师",
                        "科大讯飞 · Prompt Engineer 认证",
                        "浪潮信息 · 大模型开发工程师",
                        "浪潮信息 × 豆包 · AI+编程能力认证"
                      ].map((cert, index) => (
                        <span key={index} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-xs text-slate-300 font-mono">
                          <IconAward />
                          {cert}
                        </span>
                      ))}
                    </div>
                  </div>

                </div>
              </div>
            </section>

            {/* ========================================================================= */}
            {/* 3. 精选项目模块 (大卡片展示) */}
            {/* ========================================================================= */}

                        className="w-full aspect-[4/3] object-contain bg-[#0a0a0e] p-2 group-hover/cert:scale-105 transition-all duration-500"
                      />
                      <div className="px-4 py-2 text-xs font-mono text-slate-400 text-center">
                        证书 {i + 1} / 8
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
