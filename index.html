  <style>
    body {
      background-color: #070709;
      color: #e2e8f0;

    }
    .bg-grid-pattern {
      background-size: 48px 48px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .gradient-waves-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .border-glow-card {
      --edge-proximity: 0;
      --cursor-angle: 45deg;
      --edge-sensitivity: 30;
      --color-sensitivity: calc(var(--edge-sensitivity) + 20);
      --border-radius: 28px;
      --glow-padding: 40px;
      --cone-spread: 25;

      position: relative;
      border-radius: var(--border-radius);
      isolation: isolate;
      transform: translate3d(0, 0, 0.01px);
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      border: 1px solid rgb(255 255 255 / 15%);
      background: var(--card-bg, #120F17);
      overflow: visible;
      box-shadow:
        rgba(0, 0, 0, 0.1) 0px 1px 2px,
        rgba(0, 0, 0, 0.1) 0px 2px 4px,
        rgba(0, 0, 0, 0.1) 0px 4px 8px,
        rgba(0, 0, 0, 0.1) 0px 8px 16px,
        rgba(0, 0, 0, 0.1) 0px 16px 32px,
        rgba(0, 0, 0, 0.1) 0px 32px 64px;
    }
    .border-glow-card::before,
    .border-glow-card::after,
    .border-glow-card > .edge-light {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      transition: opacity 0.25s ease-out;
      z-index: -1;
    }
    .border-glow-card:not(:hover):not(.sweep-active)::before,
    .border-glow-card:not(:hover):not(.sweep-active)::after,
    .border-glow-card:not(:hover):not(.sweep-active) > .edge-light {
      opacity: 0;
      transition: opacity 0.75s ease-in-out;
    }
    .border-glow-card::before {
      border: 1px solid transparent;
      background:
        linear-gradient(var(--card-bg, #120F17) 0 100%) padding-box,
        linear-gradient(rgb(255 255 255 / 0%) 0% 100%) border-box,
        var(--gradient-one, radial-gradient(at 80% 55%, hsla(268, 100%, 76%, 1) 0px, transparent 50%)) border-box,
        var(--gradient-two, radial-gradient(at 69% 34%, hsla(349, 100%, 74%, 1) 0px, transparent 50%)) border-box,
        var(--gradient-three, radial-gradient(at 8% 6%, hsla(136, 100%, 78%, 1) 0px, transparent 50%)) border-box,
        var(--gradient-four, radial-gradient(at 41% 38%, hsla(192, 100%, 64%, 1) 0px, transparent 50%)) border-box,
        var(--gradient-five, radial-gradient(at 86% 85%, hsla(186, 100%, 74%, 1) 0px, transparent 50%)) border-box,
        var(--gradient-six, radial-gradient(at 82% 18%, hsla(52, 100%, 65%, 1) 0px, transparent 50%)) border-box,
        var(--gradient-seven, radial-gradient(at 51% 4%, hsla(12, 100%, 72%, 1) 0px, transparent 50%)) border-box,
        var(--gradient-base, linear-gradient(#c299ff 0 100%)) border-box;
      opacity: calc((var(--edge-proximity) - var(--color-sensitivity)) / (100 - var(--color-sensitivity)));
      mask-image:
        conic-gradient(
          from var(--cursor-angle) at center,
          black calc(var(--cone-spread) * 1%),
          transparent calc((var(--cone-spread) + 15) * 1%),
          transparent calc((100 - var(--cone-spread) - 15) * 1%),
          black calc((100 - var(--cone-spread)) * 1%)
        );
    }
    .border-glow-card::after {
      border: 1px solid transparent;
      background:
        var(--gradient-one, radial-gradient(at 80% 55%, hsla(268, 100%, 76%, 1) 0px, transparent 50%)) padding-box,
        var(--gradient-two, radial-gradient(at 69% 34%, hsla(349, 100%, 74%, 1) 0px, transparent 50%)) padding-box,
        var(--gradient-three, radial-gradient(at 8% 6%, hsla(136, 100%, 78%, 1) 0px, transparent 50%)) padding-box,
        var(--gradient-four, radial-gradient(at 41% 38%, hsla(192, 100%, 64%, 1) 0px, transparent 50%)) padding-box,
        var(--gradient-five, radial-gradient(at 86% 85%, hsla(186, 100%, 74%, 1) 0px, transparent 50%)) padding-box,
        var(--gradient-six, radial-gradient(at 82% 18%, hsla(52, 100%, 65%, 1) 0px, transparent 50%)) padding-box,
        var(--gradient-seven, radial-gradient(at 51% 4%, hsla(12, 100%, 72%, 1) 0px, transparent 50%)) padding-box,
        var(--gradient-base, linear-gradient(#c299ff 0 100%)) padding-box;
      mask-image:
        linear-gradient(to bottom, black, black),
        radial-gradient(ellipse at 50% 50%, black 40%, transparent 65%),
        radial-gradient(ellipse at 66% 66%, black 5%, transparent 40%),
        radial-gradient(ellipse at 33% 33%, black 5%, transparent 40%),
        radial-gradient(ellipse at 66% 33%, black 5%, transparent 40%),
        radial-gradient(ellipse at 33% 66%, black 5%, transparent 40%),
        conic-gradient(from var(--cursor-angle) at center, transparent 5%, black 15%, black 85%, transparent 95%);
      mask-composite: subtract, add, add, add, add, add;
      opacity: calc(var(--fill-opacity, 0.5) * (var(--edge-proximity) - var(--color-sensitivity)) / (100 - var(--color-sensitivity)));
      mix-blend-mode: soft-light;
    }
    .border-glow-card > .edge-light {
      inset: calc(var(--glow-padding) * -1);
      pointer-events: none;
      z-index: 1;
      mask-image:
        conic-gradient(
          from var(--cursor-angle) at center, black 2.5%, transparent 10%, transparent 90%, black 97.5%
        );
      opacity: calc((var(--edge-proximity) - var(--edge-sensitivity)) / (100 - var(--edge-sensitivity)));
      mix-blend-mode: plus-lighter;
    }
    .border-glow-card > .edge-light::before {
      content: "";
      position: absolute;
      inset: var(--glow-padding);
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px var(--glow-color, hsl(40deg 80% 80% / 100%)),
        inset 0 0 1px 0 var(--glow-color-60, hsl(40deg 80% 80% / 60%)),
        inset 0 0 3px 0 var(--glow-color-50, hsl(40deg 80% 80% / 50%)),

        inset 0 0 15px 0 var(--glow-color-30, hsl(40deg 80% 80% / 30%)),
        inset 0 0 25px 2px var(--glow-color-20, hsl(40deg 80% 80% / 20%)),
        inset 0 0 50px 2px var(--glow-color-10, hsl(40deg 80% 80% / 10%)),
        0 0 1px 0 var(--glow-color-60, hsl(40deg 80% 80% / 60%)),
        0 0 3px 0 var(--glow-color-50, hsl(40deg 80% 80% / 50%)),
        0 0 6px 0 var(--glow-color-40, hsl(40deg 80% 80% / 40%)),
        0 0 15px 0 var(--glow-color-30, hsl(40deg 80% 80% / 30%)),
        0 0 25px 2px var(--glow-color-20, hsl(40deg 80% 80% / 20%)),
        0 0 50px 2px var(--glow-color-10, hsl(40deg 80% 80% / 10%));
    }
    .border-glow-inner {
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: auto;

  <script type="text/babel">
    const { useState, useEffect } = React;

    const IconSparkles = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>;

    const IconPhone = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>;
    const IconMail = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>;
    const IconMessage = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>;

    // ── GradientWaves (React Bits) ──
    const _waveHexToRgb = hex => {
      const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!r) return [1, 1, 1];
      return [parseInt(r[1], 16) / 255, parseInt(r[2], 16) / 255, parseInt(r[3], 16) / 255];
    };
    const _waveDetailToSteps = d => d === 'low' ? 40 : d === 'high' ? 110 : 70;
    const _waveCtxMap = new WeakMap();

    const WAVE_VERTEX = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

    const WAVE_FRAGMENT = `#version 300 es
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform float uSpeed;
uniform float uAmplitude;
uniform float uWaveScale;
uniform float uWaveRatio;
uniform float uSwell;
uniform float uTurbulence;
uniform float uTilt;
uniform float uZoom;
uniform float uHeight;
uniform float uFogDepth;
uniform float uSteps;
uniform float uBrightness;
uniform float uOpacity;
uniform float uGrain;
uniform float uGrainIntensity;
uniform vec2 uMouse;
uniform float uParallax;
uniform bool uEnableMouse;
uniform vec3 uHorizonColor;
uniform vec3 uWaveColor;
uniform vec3 uCrestColor;
out vec4 fragColor;

const float MAX_DIST = 20000.0;

float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float plasma(vec3 r, vec2 freq, vec4 tc) {
  float mx = r.x + tc.x;
  mx += uSwell * sin((r.y + mx) / 20.0 + tc.y);
  float my = r.y - tc.z;
  my += uTurbulence * cos(r.x / 23.0 + tc.w);
  return r.z - (sin(mx * freq.x) * uAmplitude + sin(my * freq.y) * uAmplitude + uHeight);
}

float raymarch(vec3 pos, vec3 dir, vec2 freq, vec4 tc) {
  float dist = 0.0;
  for (int i = 0; i < 128; i++) {
    if (float(i) >= uSteps) break;
    float dscene = plasma(pos + dist * dir, freq, tc);
    if (abs(dscene) < 0.1) break;
    dist += 0.9 * dscene;
    if (!(abs(dist) < MAX_DIST)) return MAX_DIST;
  }
  return dist;
}

void main() {
  float T = iTime * uSpeed;
  vec2 freq = vec2(uWaveScale / 7.0, (uWaveScale * uWaveRatio) / 3.0);
  vec4 tc = vec4(T / 0.130, T / 0.810, T / 0.200, T / 0.710);
  float c, s;
  float vfov = (3.14159 / 2.3) / max(uZoom, 0.05);
  vec3 cam = vec3(0.0, 0.0, 30.0);
  vec2 uv = (gl_FragCoord.xy / iResolution.xy) - 0.5;
  uv.x *= iResolution.x / iResolution.y;
  uv.y *= -1.0;

  vec3 dir = vec3(0.0, 0.0, -1.0);
  float ulen = length(uv);
  float xrot = vfov * ulen;
  c = cos(xrot); s = sin(xrot);
  dir = mat3(1.0, 0.0, 0.0, 0.0, c, -s, 0.0, s, c) * dir;
  vec2 nuv = ulen > 1e-5 ? uv / ulen : vec2(1.0, 0.0);
  c = nuv.x; s = nuv.y;
  dir = mat3(c, -s, 0.0, s, c, 0.0, 0.0, 0.0, 1.0) * dir;
  c = cos(uTilt); s = sin(uTilt);
  dir = mat3(c, 0.0, s, 0.0, 1.0, 0.0, -s, 0.0, c) * dir;

  if (uEnableMouse) {
    float yaw = (uMouse.x - 0.5) * uParallax * 0.4;
    float pitch = (uMouse.y - 0.5) * uParallax * 0.4;
    c = cos(yaw); s = sin(yaw);
    dir = mat3(c, 0.0, s, 0.0, 1.0, 0.0, -s, 0.0, c) * dir;
    c = cos(pitch); s = sin(pitch);
    dir = mat3(1.0, 0.0, 0.0, 0.0, c, -s, 0.0, s, c) * dir;
  }

  float dist = raymarch(cam, dir, freq, tc);
  vec3 pos = cam + dist * dir;

  float t = clamp(uFogDepth / max(dist, 0.001), 0.0, 1.0);
  vec3 body = mix(uWaveColor, uCrestColor, clamp(pos.z * 0.08 + 0.5, 0.0, 1.0));
  vec3 col = mix(uHorizonColor, body, t);
  col *= uBrightness;
  col = clamp(col, 0.0, 1.0);

  float alpha = clamp(t, 0.0, 1.0) * uOpacity;
  if (uGrain > 0.5) {
    float g = hash21(gl_FragCoord.xy + mod(iTime, 64.0) * 11.0);
    alpha += (g - 0.5) * uGrainIntensity;
  }
  alpha = clamp(alpha, 0.0, 1.0);
  fragColor = vec4(col * alpha, alpha);
}`;

    function GradientWaves(props) {
      const { horizonColor = '#5227FF', waveColor = '#FF9FFC', crestColor = '#FFFFFF',
        speed = 0.4, amplitude = 2.5, waveScale = 0.6, waveRatio = 0.9,
        swell = 35, turbulence = 20, tilt = 1.11, zoom = 1.0,
        height = 5.5, fogDepth = 15, detail = 'medium',
        brightness = 1.0, opacity = 1.0,
        mouseInteraction = true, parallaxStrength = 0.5,
        grain = true, grainIntensity = 0.05, className = '' } = props;
      const containerRef = React.useRef(null);
      const [ready, setReady] = React.useState(false);

      React.useEffect(() => {
        let cancelled = false;
        const check = () => {
          if (cancelled) return;
          if (window.OGL) { setReady(true); return; }
          setTimeout(check, 100);
        };
        check();
        return () => { cancelled = true; };
      }, []);

      React.useEffect(() => {
        if (!ready) return;
        const container = containerRef.current;
        if (!container) return;
        const { Renderer, Program, Mesh, Triangle } = window.OGL;

        const renderer = new Renderer({
          webgl: 2, alpha: true, premultipliedAlpha: true,
          antialias: false, dpr: Math.min(window.devicePixelRatio || 1, 2)
        });
        const gl = renderer.gl;
        gl.clearColor(0, 0, 0, 0);
        const canvas = gl.canvas;
        Object.assign(canvas.style, { width: '100%', height: '100%', display: 'block' });
        container.appendChild(canvas);

        const program = new Program(gl, {
          vertex: WAVE_VERTEX, fragment: WAVE_FRAGMENT,
          uniforms: {
            iTime: { value: 0 }, iResolution: { value: new Float32Array(2) },
            uSpeed: { value: speed }, uAmplitude: { value: amplitude },
            uWaveScale: { value: waveScale }, uWaveRatio: { value: waveRatio },
            uSwell: { value: swell }, uTurbulence: { value: turbulence },
            uTilt: { value: tilt }, uZoom: { value: zoom },
            uHeight: { value: height }, uFogDepth: { value: fogDepth },
            uSteps: { value: _waveDetailToSteps(detail) }, uBrightness: { value: brightness },
            uOpacity: { value: opacity }, uGrain: { value: grain ? 1 : 0 },
            uGrainIntensity: { value: grainIntensity },
            uMouse: { value: new Float32Array([0.5, 0.5]) },
            uParallax: { value: parallaxStrength },
            uEnableMouse: { value: mouseInteraction },
            uHorizonColor: { value: new Float32Array(_waveHexToRgb(horizonColor)) },
            uWaveColor: { value: new Float32Array(_waveHexToRgb(waveColor)) },
            uCrestColor: { value: new Float32Array(_waveHexToRgb(crestColor)) }
          }
        });
        const mesh = new Mesh(gl, { geometry: new Triangle(gl), program });
        const enableMouse = { current: mouseInteraction };
        _waveCtxMap.set(container, { program, enableMouse });

        const setSize = () => {
          const rect = container.getBoundingClientRect();
          renderer.setSize(Math.max(1, Math.floor(rect.width)), Math.max(1, Math.floor(rect.height)));
          program.uniforms.iResolution.value[0] = gl.drawingBufferWidth;
          program.uniforms.iResolution.value[1] = gl.drawingBufferHeight;
          renderer.render({ scene: mesh });
        };
        const ro = new ResizeObserver(setSize);
        ro.observe(container);
        setSize();

        const cur = [0.5, 0.5], tgt = [0.5, 0.5];
        const onMove = e => { const r = canvas.getBoundingClientRect(); tgt[0] = (e.clientX - r.left) / r.width; tgt[1] = 1 - (e.clientY - r.top) / r.height; };
        const onLeave = () => { tgt[0] = 0.5; tgt[1] = 0.5; };
        canvas.addEventListener('pointermove', onMove, { passive: true });
        canvas.addEventListener('pointerleave', onLeave);

        let raf = 0, visible = true, pageVisible = !document.hidden;
        const t0 = performance.now();
        const loop = t => {
          program.uniforms.iTime.value = (t - t0) * 0.001;
          cur[0] += 0.05 * (enableMouse.current ? tgt[0] - cur[0] : 0.5 - cur[0]);
          cur[1] += 0.05 * (enableMouse.current ? tgt[1] - cur[1] : 0.5 - cur[1]);
          program.uniforms.uMouse.value[0] = cur[0];
          program.uniforms.uMouse.value[1] = cur[1];
          renderer.render({ scene: mesh });
          raf = requestAnimationFrame(loop);
        };
        const start = () => { if (visible && pageVisible && !raf) raf = requestAnimationFrame(loop); };
        const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
        const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; visible ? start() : stop(); }, { threshold: 0 });
        io.observe(container);
        const onVis = () => { pageVisible = !document.hidden; pageVisible ? start() : stop(); };
        document.addEventListener('visibilitychange', onVis);
        start();

        return () => {
          stop(); ro.disconnect(); io.disconnect();
          document.removeEventListener('visibilitychange', onVis);
          canvas.removeEventListener('pointermove', onMove);
          canvas.removeEventListener('pointerleave', onLeave);
          _waveCtxMap.delete(container);
          try { container.removeChild(canvas); } catch (e) {}
          gl.getExtension('WEBGL_lose_context')?.loseContext();
        };
      }, [ready]);

      React.useEffect(() => {
        if (!ready) return;
        const container = containerRef.current;
        if (!container) return;
        const ctx = _waveCtxMap.get(container);
        if (!ctx) return;
        const u = ctx.program.uniforms;
        ctx.enableMouse.current = mouseInteraction;
        u.uSpeed.value = speed; u.uAmplitude.value = amplitude;
        u.uWaveScale.value = waveScale; u.uWaveRatio.value = waveRatio;
        u.uSwell.value = swell; u.uTurbulence.value = turbulence;
        u.uTilt.value = tilt; u.uZoom.value = zoom;
        u.uHeight.value = height; u.uFogDepth.value = fogDepth;
        u.uSteps.value = _waveDetailToSteps(detail);
        u.uBrightness.value = brightness; u.uOpacity.value = opacity;
        u.uGrain.value = grain ? 1 : 0; u.uGrainIntensity.value = grainIntensity;
        u.uParallax.value = parallaxStrength;
        u.uEnableMouse.value = mouseInteraction;
        const sc = (arr, color) => { const [r, g, b] = _waveHexToRgb(color); arr[0] = r; arr[1] = g; arr[2] = b; };
        sc(u.uHorizonColor.value, horizonColor);
        sc(u.uWaveColor.value, waveColor);
        sc(u.uCrestColor.value, crestColor);
      }, [ready, horizonColor, waveColor, crestColor, speed, amplitude, waveScale, waveRatio, swell, turbulence, tilt, zoom, height, fogDepth, detail, brightness, opacity, grain, grainIntensity, mouseInteraction, parallaxStrength]);

      return React.createElement('div', { ref: containerRef, className: `gradient-waves-container ${className}`.trim() });
    }

    // ===== BorderGlow 组件 (React Bits) =====
    function parseHSL(hslStr) {
      const match = hslStr.match(/([\d.]+)\s*([\d.]+)%?\s*([\d.]+)%?/);
      if (!match) return { h: 40, s: 80, l: 80 };
      return { h: parseFloat(match[1]), s: parseFloat(match[2]), l: parseFloat(match[3]) };
    }

    function buildGlowVars(glowColor, intensity) {
      const { h, s, l } = parseHSL(glowColor);
      const base = `${h}deg ${s}% ${l}%`;
      const opacities = [100, 60, 50, 40, 30, 20, 10];
      const keys = ['', '-60', '-50', '-40', '-30', '-20', '-10'];
      const vars = {};
      for (let i = 0; i < opacities.length; i++) {
        vars[`--glow-color${keys[i]}`] = `hsl(${base} / ${Math.min(opacities[i] * intensity, 100)}%)`;
      }
      return vars;
    }

    const GRADIENT_POSITIONS = ['80% 55%', '69% 34%', '8% 6%', '41% 38%', '86% 85%', '82% 18%', '51% 4%'];
    const GRADIENT_KEYS = ['--gradient-one', '--gradient-two', '--gradient-three', '--gradient-four', '--gradient-five', '--gradient-six', '--gradient-seven'];
    const COLOR_MAP = [0, 1, 2, 0, 1, 2, 1];

    function buildGradientVars(colors) {
      const vars = {};
      for (let i = 0; i < 7; i++) {
        const c = colors[Math.min(COLOR_MAP[i], colors.length - 1)];
        vars[GRADIENT_KEYS[i]] = `radial-gradient(at ${GRADIENT_POSITIONS[i]}, ${c} 0px, transparent 50%)`;
      }
      vars['--gradient-base'] = `linear-gradient(${colors[0]} 0 100%)`;
      return vars;
    }

    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
    function easeInCubic(x) { return x * x * x; }

    function animateValue({ start = 0, end = 100, duration = 1000, delay = 0, ease = easeOutCubic, onUpdate, onEnd }) {
      const t0 = performance.now() + delay;
      function tick() {
        const elapsed = performance.now() - t0;
        const t = Math.min(elapsed / duration, 1);
        onUpdate(start + (end - start) * ease(t));
        if (t < 1) requestAnimationFrame(tick);
        else if (onEnd) onEnd();
      }
      setTimeout(() => requestAnimationFrame(tick), delay);
    }

    function BorderGlow(props) {
      const {
        children,
        className = '',
        edgeSensitivity = 30,
        glowColor = '40 80 80',
        backgroundColor = '#120F17',
        borderRadius = 28,
        glowRadius = 40,
        glowIntensity = 1.0,
        coneSpread = 25,
        animated = false,
        colors = ['#c084fc', '#f472b6', '#38bdf8'],
        fillOpacity = 0.5,
      } = props;
      const cardRef = React.useRef(null);

      const getCenterOfElement = React.useCallback((el) => {
        const { width, height } = el.getBoundingClientRect();
        return [width / 2, height / 2];
      }, []);

      const getEdgeProximity = React.useCallback((el, x, y) => {
        const [cx, cy] = getCenterOfElement(el);
        const dx = x - cx;
        const dy = y - cy;
        let kx = Infinity;
        let ky = Infinity;
        if (dx !== 0) kx = cx / Math.abs(dx);
        if (dy !== 0) ky = cy / Math.abs(dy);
        return Math.min(Math.max(1 / Math.min(kx, ky), 0), 1);
      }, [getCenterOfElement]);

      const getCursorAngle = React.useCallback((el, x, y) => {
        const [cx, cy] = getCenterOfElement(el);
        const dx = x - cx;
        const dy = y - cy;
        if (dx === 0 && dy === 0) return 0;
        const radians = Math.atan2(dy, dx);
        let degrees = radians * (180 / Math.PI) + 90;
        if (degrees < 0) degrees += 360;
        return degrees;
      }, [getCenterOfElement]);

      const handlePointerMove = React.useCallback((e) => {
        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const edge = getEdgeProximity(card, x, y);
        const angle = getCursorAngle(card, x, y);
        card.style.setProperty('--edge-proximity', `${(edge * 100).toFixed(3)}`);
        card.style.setProperty('--cursor-angle', `${angle.toFixed(3)}deg`);
      }, [getEdgeProximity, getCursorAngle]);

      React.useEffect(() => {
        if (!animated || !cardRef.current) return;
        const card = cardRef.current;
        const angleStart = 110;
        const angleEnd = 465;
        card.classList.add('sweep-active');
        card.style.setProperty('--cursor-angle', `${angleStart}deg`);
        animateValue({ duration: 500, onUpdate: v => card.style.setProperty('--edge-proximity', v) });
        animateValue({ ease: easeInCubic, duration: 1500, end: 50, onUpdate: v => {
          card.style.setProperty('--cursor-angle', `${(angleEnd - angleStart) * (v / 100) + angleStart}deg`);
        }});
        animateValue({ ease: easeOutCubic, delay: 1500, duration: 2250, start: 50, end: 100, onUpdate: v => {
          card.style.setProperty('--cursor-angle', `${(angleEnd - angleStart) * (v / 100) + angleStart}deg`);
        }});
        animateValue({ ease: easeInCubic, delay: 2500, duration: 1500, start: 100, end: 0,
          onUpdate: v => card.style.setProperty('--edge-proximity', v),
          onEnd: () => card.classList.remove('sweep-active'),
        });
      }, [animated]);

      const glowVars = buildGlowVars(glowColor, glowIntensity);

      return (
        <div
          ref={cardRef}
          onPointerMove={handlePointerMove}
          className={`border-glow-card ${className}`.trim()}
          style={{
            '--card-bg': backgroundColor,
            '--edge-sensitivity': edgeSensitivity,
            '--border-radius': `${borderRadius}px`,
            '--glow-padding': `${glowRadius}px`,
            '--cone-spread': coneSpread,
            '--fill-opacity': fillOpacity,
            ...glowVars,
            ...buildGradientVars(colors),
          }}
        >
          <span className="edge-light" />
          <div className="border-glow-inner">
            {children}
          </div>
        </div>
      );
    }

    // ===== PPTX 二进制数据懒加载（首屏不阻塞） =====
    function decodePptxBase64() {
      const bin = atob(window.PPTX_DATA);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr.buffer;
    }

    async function getPptxBuffer(src) {
      // 1) 已有内嵌数据直接用
      if (window.PPTX_DATA) return decodePptxBase64();
      // 2) HTTP 环境下优先 fetch（比 base64 更省流量）
      try {
        const res = await fetch(src);
        if (res.ok) return await res.arrayBuffer();
      } catch (e) { /* file:// 下会失败，走回退 */ }
      // 3) 回退：按需注入 pptx-data.js（file:// 场景）
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'pptx-data.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('PPTX 数据加载失败'));
        document.head.appendChild(s);
      });
      if (!window.PPTX_DATA) throw new Error('PPTX 数据缺失');
      return decodePptxBase64();
    }

    // pptx-browser 渲染库：打开 PPTX 弹窗时才按需加载
    let _pptxRendererPromise = null;
    function ensurePptxRenderer() {
      if (window.PptxRenderer) return Promise.resolve(window.PptxRenderer);
      if (!_pptxRendererPromise) {
        _pptxRendererPromise = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.type = 'module';
          s.textContent = "import P from 'https://cdn.jsdelivr.net/npm/pptx-browser@4.1.5/src/index.js'; window.PptxRenderer = P; window.dispatchEvent(new Event('pptx-renderer-ready'));";
          s.onerror = () => reject(new Error('PPTX 渲染库加载失败'));
          window.addEventListener('pptx-renderer-ready', () => resolve(window.PptxRenderer), { once: true });
          document.head.appendChild(s);
        });
      }
      return _pptxRendererPromise;
    }

    // ===== PPTX 幻灯片预览组件 (pptx-browser) =====
    function PptxViewer({ src }) {
      const canvasRef = React.useRef(null);
      const rendererRef = React.useRef(null);
      const [status, setStatus] = useState('loading');
      const [errMsg, setErrMsg] = useState('');
      const [slideCount, setSlideCount] = useState(0);
      const [current, setCurrent] = useState(0);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const PptxRenderer = await ensurePptxRenderer();
            if (cancelled) return;
            const buf = await getPptxBuffer(src);
            const renderer = new PptxRenderer();
            rendererRef.current = renderer;
            await renderer.load(buf);
            if (cancelled) { try { renderer.destroy(); } catch (e) {} return; }
            setSlideCount(renderer.slideCount);
            setStatus('ready');
          } catch (e) {
            if (!cancelled) {
              setErrMsg(e && e.message ? e.message : String(e));
              setStatus('error');
            }
          }
        })();
        return () => { cancelled = true; };
      }, [src]);

      useEffect(() => {
        if (status !== 'ready' || !slideCount) return;
        const renderer = rendererRef.current;
        const canvas = canvasRef.current;
        if (!renderer || !canvas) return;
        renderer.renderSlide(0, canvas, 1280)
          .then(() => setCurrent(0))
          .catch(e => { setErrMsg(e && e.message ? e.message : String(e)); setStatus('error'); });
      }, [status, slideCount]);

      useEffect(() => () => {
        if (rendererRef.current) { try { rendererRef.current.destroy(); } catch (e) {} }
      }, []);

      const goTo = (i) => {
        if (status !== 'ready' || i < 0 || i >= slideCount) return;
        const renderer = rendererRef.current;
        const canvas = canvasRef.current;
        if (!renderer || !canvas) return;
        renderer.renderSlide(i, canvas, 1280)
          .then(() => setCurrent(i))
          .catch(e => setErrMsg(e && e.message ? e.message : String(e)));
      };

      return (
        <div>
          {status === 'loading' && (
            <div className="flex flex-col items-center justify-center py-24 text-center">
              <div className="w-8 h-8 rounded-full border-2 border-purple-400 border-t-transparent animate-spin mb-4"></div>
              <p className="text-slate-400 text-sm font-mono">正在加载 PPTX 作品…</p>
            </div>
          )}

          {status === 'error' && (
            <div className="py-20 text-center">
              <p className="text-red-400 text-sm font-mono">{errMsg}</p>
            </div>
          )}

          {status === 'ready' && (
            <div>
              <div className="bg-black/40 rounded-2xl p-3 flex items-center justify-center">
                <canvas ref={canvasRef} className="w-full h-auto" />
              </div>
              <div className="flex items-center justify-between mt-5">
                <button
                  onClick={() => goTo(current - 1)}
                  disabled={current <= 0}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-white/10 text-sm text-slate-300 hover:text-white hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none transition-all duration-300"
                >
                  ← 上一页
                </button>
                <span className="text-xs font-mono text-slate-400">{current + 1} / {slideCount}</span>
                <button
                  onClick={() => goTo(current + 1)}
                  disabled={current >= slideCount - 1}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-white/10 text-sm text-slate-300 hover:text-white hover:bg-white/10 disabled:opacity-30 disabled:pointer-events-none transition-all duration-300"
                >
                  下一页 →
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

  <!-- ===== GSAP 高端动效 ===== -->
  <script>
    (function () {
      function initMotion() {
        if (window.__motionInit) return;
        window.__motionInit = true;
        if (!window.gsap || !window.ScrollTrigger) return;
        gsap.registerPlugin(ScrollTrigger);

        // 尊重"减少动态"偏好
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          gsap.set('[data-hero], .border-glow-card, [data-motion-img] img, [data-stat-grid] > *', { clearProps: 'all' });
          return;
        }

        var home = document.getElementById('home');
        var headerInner = document.querySelector('header > div');

        // ---------- 1. 首屏 Opening ----------
        var open = gsap.timeline({ defaults: { ease: 'power4.out' } });
        if (headerInner) open.from(headerInner, { y: -20, opacity: 0, duration: 1.0, ease: 'power3.out' }, 0);
        if (home) {
          open
            .from(home.querySelector('[data-hero="badge"]'), { y: -44, opacity: 0, duration: 1.0 }, 0.05)
            .from(home.querySelectorAll('[data-hero="line"]'), {
              yPercent: 115, scale: 0.97, skewY: 3, duration: 1.6, stagger: 0.15
            }, '-=0.55')
            .from(home.querySelector('[data-hero="desc"]'), { y: 50, opacity: 0, duration: 1.2 }, '-=1.0')
            .from(home.querySelectorAll('[data-hero="cta"] > *'), { y: 34, opacity: 0, duration: 0.9, stagger: 0.12 }, '-=0.85')
            .from(home.querySelectorAll('[data-hero="meta"] > div'), { y: 24, opacity: 0, duration: 0.9, stagger: 0.08 }, '-=0.45');
        }

        // ---------- 2. 各模块：英文大标题先进场，卡片再依次 stagger ----------
        ['about', 'projects', 'capabilities', 'contact', 'thanks'].forEach(function (id) {
          var section = document.getElementById(id);
          if (!section) return;

          var kicker = section.querySelector('.tracking-widest');
          var heading = section.querySelector('h2');
          var cards = section.querySelectorAll('.border-glow-card');
          var statGrid = section.querySelector('[data-stat-grid]');

          var tl = gsap.timeline({
            scrollTrigger: { trigger: section, start: 'top 80%', once: true }
          });

          if (kicker) tl.from(kicker, { y: 130, opacity: 0, ease: 'power4.out', duration: 1.35 }, 0);
          if (heading) tl.from(heading, { y: 130, opacity: 0, ease: 'power4.out', duration: 1.35 }, 0.08);
          if (cards.length) tl.from(cards, { y: 96, opacity: 0, ease: 'power3.out', duration: 1.1, stagger: 0.15 }, 0.25);
          if (statGrid && statGrid.children.length) tl.from(statGrid.children, { y: 56, opacity: 0, ease: 'power4.out', duration: 0.9, stagger: 0.1 }, 0.35);
        });

        // ---------- 3. 图片 reveal + 轻微 parallax ----------
        document.querySelectorAll('[data-motion-img]').forEach(function (container) {
          var img = container.querySelector('img');
          if (img) {
            var prevTransition = img.style.transition;
            img.style.transition = 'none';
            gsap.fromTo(img, { scale: 1.22 }, {
              scale: 1,
              duration: 1.5,
              ease: 'power3.out',
              scrollTrigger: { trigger: container, start: 'top 86%', once: true },
              onComplete: function () {
                img.style.transition = prevTransition;
                gsap.set(img, { clearProps: 'transform' });
              }
            });
          }
          gsap.fromTo(container, { y: 24 }, {
            y: -24,
            ease: 'none',
            scrollTrigger: { trigger: container, start: 'top bottom', end: 'bottom top', scrub: 1 }
          });
        });

        // 图片/字体加载完成后重算触发行程，避免布局高度变化导致偏移
        window.addEventListener('load', function () { ScrollTrigger.refresh(); });
        setTimeout(function () { ScrollTrigger.refresh(); }, 600);
      }

      function wait() {
        if (document.getElementById('home') && window.gsap && window.ScrollTrigger) {
          initMotion();
        } else {
          setTimeout(wait, 80);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { setTimeout(wait, 120); });
      } else {
        setTimeout(wait, 120);
      }
      wait();
    })();
  </script>
